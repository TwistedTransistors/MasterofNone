<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Story — Master of None</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try { var t = localStorage.getItem("mon-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">→ Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="Master of None home">
        <span class="brand-mark" aria-hidden="true">MoN</span>
        <span>Master of None <small>blog</small></span>
      </a>

      <nav class="nav" id="site-navigation" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="#">Essays<span class="plus">[+]</span></a>
        <a href="#">Build logs</a>
        <a href="#">Reading</a>
        <a href="#">About</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
          <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="btn" href="index.html#subscribe"><kbd>S</kbd>Subscribe</a>
        <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-navigation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <!-- Post content is rendered here from assets/js/posts.js using ?slug= -->
    <article id="post"></article>

    <section class="section post-footer" aria-labelledby="more-title">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="label">Keep reading</span>
            <h2 id="more-title">More stories</h2>
          </div>
          <a href="index.html">All stories →</a>
        </div>
        <div class="story-grid" id="story-grid" data-limit="4"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="prompt">© <span id="year">2026</span> Master of None</span>
      <nav aria-label="Footer">
        <a href="#">RSS</a>
        <a href="#">Privacy</a>
        <a href="#">Contact</a>
      </nav>
      <span class="shortcuts"><kbd>T</kbd> theme <kbd>H</kbd> home <kbd>?</kbd> help</span>
    </div>
  </footer>

  <script src="assets/js/posts.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
